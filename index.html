<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B2A4A" />
    <meta name="description" content="Learn Biblical Hebrew through the triliteral root system, with spaced repetition and real unedited verses." />

    <!-- iOS standalone hints. iOS Safari ignores the manifest's display mode,
         so these are what make "Add to Home Screen" open chromeless. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shoresh" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Gentium+Plus:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Shoresh — Learn Biblical Hebrew by the Root</title>

    <!--
      Apply the saved theme before first paint. Settings live in IndexedDB,
      which is async — without this a light-theme user gets a dark flash on
      every cold start. Kept deliberately tiny and dependency-free; the real
      logic is in src/lib/theme.ts.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("shoresh.theme") || "dark";
          var resolved =
            pref === "system"
              ? window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
              : pref;
          document.documentElement.dataset.theme = resolved;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", resolved === "light" ? "#1b2a4a" : "#12172a");
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
